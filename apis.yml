aid: wish
name: Wish
description: >-
  Wish, operated by ContextLogic Inc., is a global mobile-first e-commerce
  marketplace that connects value-conscious consumers with merchants and
  manufacturers around the world, with a large share of inventory shipped
  direct from suppliers. The Wish Marketplace V3 API lets sellers and ERP
  partners programmatically manage their storefront and operations: create and
  update products and variations, synchronize inventory and pricing, retrieve
  and fulfill orders, modify tracking and shipping-carrier assignments, run
  bulk create/download jobs, manage support tickets, penalties and
  infractions, run ProductBoost and promotion campaigns, meet EU/EPR product
  compliance obligations, and subscribe to webhooks for real-time order and
  product events. Authentication is OAuth 2.0 (authorization code flow with 37
  scopes) plus OpenID Connect, using bearer access tokens over HTTPS, with
  production and sandbox environments.
