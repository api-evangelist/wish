  /api/v3/products/bulk_get/{id}:
    get:
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BulkJob'
          description: successfully queried for the get products job
        '400':
          content:
            application/json:
              examples:
                InvalidParameter:
                  value:
                    message: There is no such get products job for the merchant.
                    code: '90001'
              schema:
                $ref: '#/components/schemas/APIError'
          description: failed to query for the get products job
      parameters:
      - required: true
        in: path
        description: ID of the get products job to query
        name: id
        schema:
          type: string
          format: object-id
      tags:
      - Bulk Products
      summary: Get the get products job status
      security:
      - OAuth2:
        - products:read
      operationId: getGetProductsStatus
      x-code-samples:
      - lang: python_requests
        source: 'import requests


          url = "https://merchant.wish.com/api/v3/products/bulk_get/{id}"


          headers = {''authorization'': ''Bearer REPLACE_BEARER_TOKEN''}


          response = requests.request("GET", url, headers=headers)


          print(response.text)'
      - lang: php_curl
        source: "<?php\n\n$curl = curl_init();\n\ncurl_setopt_array($curl, array(\n  CURLOPT_URL => \"https://merchant.wish.com/api/v3/products/bulk_get/{id}\",\n  CURLOPT_RETURNTRANSFER => true,\n  CURLOPT_ENCODING => \"\",\n  CURLOPT_MAXREDIRS => 10,\n  CURLOPT_TIMEOUT => 30,\n  CURLOPT_HTTP_VERSION => CURL_HTTP_VERSION_1_1,\n  CURLOPT_CUSTOMREQUEST => \"GET\",\n  CURLOPT_HTTPHEADER => array(\n    \"authorization: Bearer REPLACE_BEARER_TOKEN\"\n  ),\n));\n\n$response = curl_exec($curl);\n$err = curl_error($curl);\n\ncurl_close($curl);\n\nif ($err) {\n  echo \"cURL Error #:\" . $err;\n} else {\n  echo $response;\n}"
      - lang: java_unirest
        source: "HttpResponse<String> response = Unirest.get(\"https://merchant.wish.com/api/v3/products/bulk_get/{id}\")\n  .header(\"authorization\", \"Bearer REPLACE_BEARER_TOKEN\")\n  .asString();"
      - lang: javascript_jquery
        source: "var settings = {\n  \"async\": true,\n  \"crossDomain\": true,\n  \"url\": \"https://merchant.wish.com/api/v3/products/bulk_get/{id}\",\n  \"method\": \"GET\",\n  \"headers\": {\n    \"authorization\": \"Bearer REPLACE_BEARER_TOKEN\"\n  }\n}\n\n$.ajax(settings).done(function (response) {\n  console.log(response);\n});"
      - lang: shell_curl
        source: "curl --request GET \\\n  --url 'https://merchant.wish.com/api/v3/products/bulk_get/{id}' \\\n  --header 'authorization: Bearer REPLACE_BEARER_TOKEN'"
      description: Get the get products job status
components:
  schemas:
    Price:
      required:
      - amount
      - currency_code
      type: object
      properties:
        amount:
          minimum: 0
          type: number
          description: Non-negative amount in decimals.
          format: float
        currency_code:
          format: iso-4217
          type: string
          description: The 3-letter currency code defined in [ISO 4217](https://www.iso.org/iso-4217-currency-codes.html).
          example: USD
    Option:
      required:
      - name
      - value
      type: object
      properties:
        name:
          type: string
          description: The name of the option like SIZE and COLOR.
        value:
          minLength: 1
          type: string
          description: The value of the option.
    CreateImage:
      type: object
      properties:
        url:
          type: string
          description: The URL of the image of the product. Images can be in JPEG, PNG or GIF format. Images should be at least 500 x 500 pixels in size. Maximum size 178 MP and 24MB
          format: uri
        variation_skus:
          items:
            minLength: 1
            type: string
            maxLength: 80
          type: array
          description: The list of SKUs of the variations that use this image.</br> `This field will be deprecated soon. To add images to or get images for product variations, use the variations.image field`
        is_clean_image:
          type: boolean
          description: Wish products might appear in external shopping searches. A "clean image" is used to represent the product in such searches. This is a required field when creating a new product listing (Create a Product). Only one clean image URL can be specified for a product. [Learn more](https://merchanthelp.wish.com/s/article/mu360033668153?language=en_US).
    APIError:
      required:
      - code
      - message
      type: object
      properties:
        message:
          type: string
        code:
          type: integer
          format: int32
    RegionShippingDetail:
      required:
      - destination
      type: object
      properties:
        is_enabled:
          default: true
          type: boolean
          description: Whether shipping is enabled for the destination.
        price:
          $ref: '#/components/schemas/RegionShippingPrice'
        destination:
          minLength: 2
          maxLength: 3
          type: string
          description: The state, province or shipping region code. Accepted regions are at [regions](https://merchant.wish.com/documentation/api/v2#regions).
          example: NY
        max_delivery_days:
          type: integer
          description: The maximum days for a product to be delivered to the customer. Can be set to null to remove the current max_delivery_days.
          nullable: true
        additional_price:
          type: object
          description: The additional shipping price for the region. Additional shipping price should be always smaller than or equal to shipping price.
          allOf:
          - $ref: '#/components/schemas/RegionShippingPrice'
    Video:
      type: object
      properties:
        url:
          type: string
          description: The URL of the demo video of the product.
          format: uri
    VariationAttribute:
      required:
      - name
      type: object
      properties:
        name:
          type: string
          description: The name of the attribute. Input the relevant "name". Please browse our [Taxonomy APIs](/documentation/api/v3/reference#operation/getCategoryAttributes) for possible attribute names.
        value:
          items:
            type: string
          type: array
          description: The value of the attribute. Can be set to null to remove the attribute. Input the relevant "accepted_values". Please browse our [Taxonomy APIs](/documentation/api/v3/reference#operation/getCategoryAttributes) for possible attribute values.
          nullable: true
    EditableVariationParams:
      type: object
      properties:
        sku:
          minLength: 1
          type: string
          description: The Stock Keeping Unit of the variation.
          maxLength: 80
        quantity_value:
          nullable: true
          minimum: 0
          type: number
          description: The total quantity of the product variant (in the given unit) that is used to calculate price per unit. Note that if a product has multiple product variants, you will need to set quantity values for each product variant. [Learn More](https://merchantfaq.wish.com/hc/en-us/articles/4405383750555).
          format: float
        image:
          type: string
          description: The URL of the image associated with the variation. This is a required field when adding a new product listing with variations (Create a Product) or adding variations to existing product listings (Create a variation). The variation images don’t need to be unique (multiple variations can have the same image), but they have to be specified for each variation. These images must be a part of extra_images.
          format: uri
        price:
          type: object
          description: The price of the variation. Price is required for rev-share merhcants.
          allOf:
          - $ref: '#/components/schemas/Price'
        merchant_set_cost:
          nullable: true
          minimum: 0
          type: number
          description: Supply cost maintained by merchants on variation level
          format: float
        cost:
          type: object
          description: The cost of the variation. Cost is required for cost-based merchants.
          allOf:
          - $ref: '#/components/schemas/Price'
        gtin:
          pattern: ^[0-9]{8,14}$
          type: string
          description: Should be 8 to 14 digits GTIN (UPC, EAN, ISBN) that contains no letters or other characters. This number is barcode symbology used for tracking trade items in stores and scanning them at the point of sale.
          nullable: true
        attributes:
          items:
            $ref: '#/components/schemas/VariationAttribute'
          type: array
          description: The custom attributes of the variation. Merchants may use the "name" and "value" fields here to add specific attributes for the product’s category. Our [Taxonomy APIs](/documentation/api/v3/reference#operation/getCategoryAttributes) contains the list of all attributes for each category, mentions which ones are required, and the corresponding accepted values for each attribute.
          nullable: true
        inventories:
          items:
            $ref: '#/components/schemas/WarehouseInventory'
          type: array
          description: The inventory of the variation in each warehouse.
        options:
          items:
            $ref: '#/components/schemas/Option'
          type: array
          description: This field is used to define the parameters for the creation of variations. You can create your variations with traditional Color and Size fields or use category-specific attributes. Each combination of option values may be a variation for that product. See which category-specific attributes can be used by using the [Taxonomy APIs](/documentation/api/v3/reference#operation/getCategoryAttributes) and the field attributes.constraint.is_variation_attribute.
        logistics_details:
          type: object
          description: The logistics details of the variation.
          allOf:
          - $ref: '#/components/schemas/LogisticsInfo'
    ProductUpdateAdvancedLogisticsShipping:
      type: object
      allOf:
      - $ref: '#/components/schemas/AdvancedLogisticsShipping'
      - required:
        - warehouse_id
        type: object
        properties:
          warehouse_id:
            type: string
            description: The ID of the warehouse.
            format: object-id
    UnitInput:
      enum:
      - OUNCE
      - POUND
      - MILLIGRAM
      - GRAM
      - KILOGRAM
      - FLUID_OUNCE
      - PINT
      - QUART
      - GALLON
      - MILLILITER
      - CENTILITER
      - LITER
      - CUBICMETER
      - INCH
      - FOOT
      - YARD
      - CENTIMETER
      - METER
      - SQUARE_FOOT
      - SQUARE_METER
      - COUNT
      - LOAD
      - WASH
      - ROLL
      - POD
      - null
      type: string
      description: The unit of measurement for the total content of a product. This will be used to display the price per unit, and is the unit of measurement that will be used for both the Reference Value and the Quantity Value attributes. [Learn More](https://merchantfaq.wish.com/hc/en-us/articles/4405383750555).
      nullable: true
    RegionShippingPrice:
      properties:
        amount:
          minimum: 0
          type: number
          description: Non-negative amount in decimals.
          format: float
        currency_code:
          format: iso-4217
          type: string
          description: The 3-letter currency code defined in [ISO 4217](https://www.iso.org/iso-4217-currency-codes.html).
          example: USD
      required:
      - amount
      - currency_code
      type: object
      description: The shipping price for the region. Can be set to null to remove the current region shipping price.
      nullable: true
    AdvancedLogisticsShipping:
      type: object
      properties:
        calculated_first_mile_shipping:
          readOnly: true
          type: object
          description: The initial Wish-calculated first-mile shipping price based on first groups of orders received.
          allOf:
          - $ref: '#/components/schemas/Money'
        effective_date:
          readOnly: true
          type: string
          description: The starting date when first-mile shipping price will apply to orders bound for destination countries included in Wish’s unification initiative.
          format: date-time
        effective_first_mile_shipping:
          type: object
          description: The effective first-mile shipping price (including any merchant adjustments) in the given warehouse. Not applicable to merchants enrolled in calculated shipping.
          allOf:
          - $ref: '#/components/schemas/Money'
        enabled:
          type: boolean
          description: Whether the product in the warehouse has destination countries supported by Wish’s unification initiative. For merchants enrolled in calculated shipping, this will instead enable or disable calculated shipping on the product.
        warehouse_id:
          type: string
          description: The ID of the warehouse. The default warehouse will be used if not provided.
          format: object-id
    Consignment:
      type: object
      properties:
        existing_pid:
          type: string
          description: Existing PID maintained by merchants
          nullable: true
        reference_link:
          type: string
          description: Merchant provide product reference link
          nullable: true
      nullable: true
    BulkJob:
      type: object
      description: A generic report status object used when a bulk endpoint wants to return the status of their downloadable file
      properties:
        status:
          enum:
          - PENDING
          - READY
          - EXCEPTION
          type: string
          description: "1. PENDING - The report generation request has been received and is awaiting processing\n2. READY -\tThe report is ready for download from `file_urls`\n3. EXCEPTION - The report generation failed, contact our api support\n"
        total_count:
          type: number
          description: Total number of files attached to the report
        created_at:
          type: string
          description: The timestamp on when this report is created
          format: date-time
        completed_at:
          type: string
          description: The timestamp on when this report is completed
          format: date-time
        file_urls:
          items:
            type: string
          type: array
          description: When the status is READY, the report will be availble at these urls. Otherwise it will be `null`. The files will expire in a month.
          nullable: true
        processed_count:
          type: number
          description: This number indicates how many products have been processed so far
        id:
          type: string
          description: ID of the report
          format: object-id
    BulkUpdateProduct:
      type: object
      allOf:
      - $ref: '#/components/schemas/UpdateProduct'
      - required:
        - id
        type: object
        properties:
          id:
            type: string
            description: The ID of the product.
            format: object-id
    EditableProductParams:
      type: object
      properties:
        california_prop65_chemical_names:
          items:
            type: string
          type: array
          description: The specific chemical name(s) applicable to your product, if any, for compliance with [California Proposition 65](https://www.p65warnings.ca.gov/). If you selected the Food, Furniture, or Chemical warning type, you must provide at least one specific chemical name. You can provide up to a maximum of 5 chemical names. To see the full list of chemical names, please click [here](https://oehha.ca.gov/proposition-65/proposition-65-list). For more information on California Proposition 65 compliance, please see the Help Center article, "[California Proposition 65 overview and warning notices](https://merchantfaq.wish.com/hc/en-us/articles/360025359874)."
          nullable: true
        default_shipping_prices:
          minItems: 1
          items:
            $ref: '#/components/schemas/UpdateDefaultShipping'
          type: array
          description: The list of default shipping prices of the product in each warehouse. The default shipping prices for the standard warehouse is required. The default shipping price will automatically apply as the shipping price for any new or unset countries in this warehouse. [Learn More](https://wishmerchants.zendesk.com/hc/en-us/articles/360008831174/)
        description:
          minLength: 1
          type: string
          description: 'The description of the product. "\n" can be used for a new line. Maximum characters: 4,000. Do not include any HTML code.'
        tags:
          items:
            minLength: 1
            type: string
            maxLength: 80
          type: array
          description: Tags are descriptive keywords or terms assigned to each product in your feed, allowing them to be categorized and discovered by browsing or searching on Wish.com. The more accurate tags you add, the easier it is for our users to find your products. You may add up to 20 tags per product, comma separated. [Learn More](https://merchanthelp.wish.com/s/article/mu1260805100070?language=en_US).
          maxItems: 10
          nullable: true
        subcategory_id:
          type: integer
          description: The subcategory_id used to categorize the product.</br> `This field will be deprecated soon and replaced with category_id`
          nullable: true
        california_prop65_warning_type:
          nullable: true
          allOf:
          - $ref: '#/components/schemas/WarningType'
        max_quantity:
          minimum: 1
          type: integer
          description: The maximum quantity of products per order.
          nullable: true
        reference_value:
          minimum: 0
          type: integer
          description: The reference value (in the given unit) that is used to calculate the price per unit of a product and to illustrate the unit count for the consumer to see. [Learn More](https://merchantfaq.wish.com/hc/en-us/articles/4405383750555).
          nullable: true
        warehouse_to_shippings:
          items:
            $ref: '#/components/schemas/WarehouseToShipping'
          type: array
          description: The list of shipping details of the product in each warehouse.
        msrp:
          type: object
          description: The Manufacturer’s Suggested Retail Price of the product.</br> `This field will be deprecated soon.`
          allOf:
          - $ref: '#/components/schemas/Price'
        consignment:
          type: object
          description: Consignment fields.
          allOf:
          - $ref: '#/components/schemas/Consignment'
        condition:
          enum:
          - NEW
          - USED
          - REFURBISHED
          type: string
          description: The condition of the product.
        video:
          type: object
          description: The video of the product.
          allOf:
          - $ref: '#/components/schemas/Video'
        brand_id:
          type: string
          description: The requested brand ID of the product. The product must be authentic and directly manufactured by the brand owner. For example, Apple is the Brand of iPhone or iPad but Apple is not the Brand of an iPhone case not manufactured by Apple. Visit [Brand Directory](/branded-products/brand-directory) to view a list of brands to select from or request a new brand to be added.
          format: object-id
        attributes:
          items:
            $ref: '#/components/schemas/Attribute'
          type: array
          description: The custom attributes of the product. Merchants may use the "name" and "value" fields here to add specific attributes for the product’s category. Our [Taxonomy APIs](/documentation/api/v3/reference#operation/getCategoryAttributes) contains the list of all attributes for each category, mentions which ones are required, and the corresponding accepted values for each attribute. The required attributes for each category will be enforced when creating a new product listing (Create a Product).
          nullable: true
        category_id:
          type: integer
          description: 'This is used to categorize the listings. This is a required field when creating new product listings (Create a Product). This link has Wish’s category tree with the category IDs: [Link](/md/products/categories)'
        parent_sku:
          minLength: 1
          type: string
          description: The parent Stock Keeping Unit of the product.
          maxLength: 80
        unit:
          type: string
          allOf:
          - $ref: '#/components/schemas/UnitInput'
        name:
          minLength: 1
          type: string
          description: The name of the product.
    Money:
      required:
      - amount
      - currency_code
      type: object
      properties:
        amount:
          format: float
          type: number
          description: Amount in decimals.
          example: 10.4
        currency_code:
          format: iso-4217
          type: string
          description: The 3-letter currency code defined in [ISO 4217](https://www.iso.org/iso-4217-currency-codes.html).
          example: USD
    UpdateDefaultShipping:
      type: object
      allOf:
      - $ref: '#/components/schemas/DefaultShipping'
      - required:
        - default_shipping_price
        - warehouse_id
        type: object
    WarningType:
      enum:
      - CHEMICAL
      - FOOD
      - FURNITURE
      - ON_PRODUCT_CANCER
      - ON_PRODUCT_COMBINED_CANCER_REPRODUCTIVE
      - ON_PRODUCT_REPRODUCTIVE
      - RAW_WOOD
      - DIESEL_ENGINE
      type: string
      description: The warning type applicable to your product, if any, for compliance with [California Proposition 65](https://www.p65warnings.ca.gov/). For more information on California Proposition 65 compliance, please see this Help Center article, "[California Proposition 65 overview and warning notices](https://merchantfaq.wish.com/hc/en-us/articles/360025359874)."
    UpdateProductVariation:
      type: object
      allOf:
      - $ref: '#/components/schemas/EditableVariationParams'
      - required:
        - id
        type: object
        properties:
          status:
            enum:
            - ENABLED
            - DISABLED
            type: string
            description: The status of the variation. Removed variations cannot be updated.
          id:
            type: string
            description: The ID of the variation.
            format: object-id
    DefaultShipping:
      type: object
      properties:
        default_shipping_price:
          type: object
          description: The default shipping price for a product in a warehouse.
          allOf:
          - $ref: '#/components/schemas/Price'
        warehouse_id:
          type: string
          description: The ID of the warehouse.
          format: object-id
    UpdateProduct:
      type: object
      allOf:
      - $ref: '#/components/schemas/EditableProductParams'
      - type: object
        properties:
          status:
            enum:
            - ENABLED
            - DISABLED
            type: string
            description: The status of the product.
          first_mile_shippings:
            items:
              $ref: '#/components/schemas/ProductUpdateAdvancedLogisticsShipping'
            type: array
            description: The first-mile shipping price and unification initiative statuses of the product in each warehouse. Provide at least one of `effective_first_mile_shipping` or `enabled` to change the first-mile shipping price or switch the unification initiative status respectively. Only applicable to Mainland China-based merchants whose products have destination countries supported by Wish’s unification initiative. Please refer to /api/v3/unification_initiative/countries for the full list of support countries.
          main_image:
            type: object
            description: The main image of the product. Image can be in JPEG, PNG or GIF format. Images should be at least 500 x 500 pixels in size. Maximum size 178 MP and 24MB
            allOf:
            - $ref: '#/components/schemas/CreateImage'
          variations:
            minItems: 0
            items:
              $ref: '#/components/schemas/UpdateProductVariation'
            type: array
            description: The variations of the product.
            maxItems: 400
          extra_images:
            items:
              $ref: '#/components/schemas/CreateImage'
            type: array
            description: The extra images of the product in addition to the main image. It takes some time for images to be processed.
            maxItems: 100
            nullable: true
    LogisticsInfo:
      type: object
      properties:
        customs_declared_name:
          type: string
          description: Declared name of the product used for customs clearance. This is often displayed on the product packaging.
        origin_country:
          type: string
          description: Country where the product is manufactured, produced, or grown. Country code should follow [ISO 3166 Alpha-2 code](https://www.iso.org/obp/ui/#iso:pub:PUB500001:en). This is a required field when creating a new product listing (Create a Product) or creating a new variation (Create a variation).
          format: iso-3166
        weight:
          type: number
          description: The weight of the package in which your product will ship to the customer (units in grams).</br> This is a required field for mainland China-based merchants when creating a new product listing (Create a Product) or adding variations to existing product listings (Create a variation).
          format: float
        restricted_flags:
          items:
            enum:
            - HAS_POWDER
            - HAS_LIQUID
            - HAS_BATTERY
            - HAS_METAL
            type: string
          type: array
          description: Whether the product contains certain items or materials.</br> __Battery__ - Products that contain batteries, either replaceable or built into the product.</br> __Liquid__ - Products that consist of a substance that has a consistency like water or oil, including semi-liquids such as creams, gels, lubes, etc.</br> __Metal__ - Products made of or containing metal as a material component.</br> __Powder__ - Any product that is composed of fine, dry particles.
          nullable: true
        customs_hs_code:
          type: string
          description: Harmonization System Code for customs declaration.
        height:
          type: number
          description: The height of the package in which your product will ship to the customer (units in cm).
          format: float
        width:
          type: number
          description: The width of the package in which your product will ship to the customer (units in cm).
          format: float
        length:
          type: number
          description: The length of the package in which your product will ship to the customer (units in cm).
          format: float
        declared_name:
          type: string
          description: The product name for customs declaration.</br> `This field will be deprecated soon and replaced with customs_declared_name.`
        customs_declared_value:
          type: object
          description: The price of the product for customs declaration.
          allOf:
          - $ref: '#/components/schemas/Price'
        pieces:
          type: integer
          description: The number of pieces associated with the variation.
        declared_local_name:
          type: string
          description: The product name in local language for customs declaration.
    CountryShippingDetail:
      required:
      - overrides
      - destination
      type: object
      properties:
        is_enabled:
          default: true
          type: boolean
          description: Whether shipping is enabled for the country.
        max_delivery_days:
          type: integer
          description: The maximum days for a product to be delivered to the customer. Can be set to null to remove the current max_delivery_days.
          nullable: true
        overrides:
          items:
            $ref: '#/components/schemas/RegionShippingDetail'
          type: array
          description: The region shipping detail.
        destination:
          format: iso-3166
          type: string
          description: The 2-letter country code defined in [ISO 3166](https://www.iso.org/iso-3166-country-codes.html).
          example: US
        additional_price:
          type: object
          description: The additional shipping price for the country. Additional shipping price should be always smaller than or equal to shipping price.
          allOf:
          - $ref: '#/components/schemas/Price'
        price:
          type: object
          description: The shipping price for the country.
          allOf:
          - $ref: '#/components/schemas/Price'
    WarehouseInventory:
      required:
      - warehouse_id
      - inventory
      type: object
      properties:
        inventory:
          minimum: 0
          type: integer
          description: The inventory of a variation in the warehouse.
          maximum: 500000
        warehouse_id:
          type: string
          description: The ID of the warehouse.
          format: object-id
    Attribute:
      required:
      - name
      type: object
      properties:
        name:
          type: string
          description: The name of the attribute. Input the relevant "name" here. Please browse our [Taxonomy APIs](/documentation/api/v3/reference#operation/getCategoryAttributes) for possible attribute names.
        value:
          items:
            type: string
          type: array
          description: The value of the attribute. Can be set to null to remove the attribute. Input the relevant value here from the "accepted_values" here. Please browse our [Taxonomy APIs](/documentation/api/v3/reference#operation/getCategoryAttributes) for possible attribute values.
          nullable: true
    WarehouseToShipping:
      required:
      - warehouse_id
      - shipping_details
      type: object
      properties:
        shipping_details:
          items:
            $ref: '#/components/schemas/CountryShippingDetail'
          type: array
          description: The shipping details of a product in a warehouse.
        warehouse_id:
          type: string
          description: The ID of the warehouse.
          format: object-id
