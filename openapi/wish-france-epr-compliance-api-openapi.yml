components:
  schemas:
    EPRComplianceStatus:
      enum:
      - UNIQUE_IDENTIFICATION_NUMBER_LINKED
      - NO_UNIQUE_IDENTIFICATION_NUMBER
      - NOT_RECOMMENDED_TO_LINK_UNIQUE_IDENTIFICATION_NUMBER
      type: string
      description: ' 3 status: (1) a unique identification number linked, (2) no unique identification number, (3) not recommended to link a unique identification number.'
    ListFranceProductUniqueIdentificationNumbersResponse:
      items:
        $ref: '#/components/schemas/FranceProductUniqueIdentificationNumberResponse'
      type: array
      description: List of France Product Unique Identification Numbers returned
    FranceProductComplianceStatusResponse:
      items:
        $ref: '#/components/schemas/FranceProductComplianceStatus'
      type: array
      description: List of objects including a product id, compliance status and UIN id.
    FranceProductComplianceStatus:
      type: object
      properties:
        unique_identification_number_ids:
          items:
            type: string
            description: The unique identifiers of a product
            format: object-id
          type: array
          description: List of unique identifier of unique identification numbers that are submitted by the merchant for compliance reasons
          maxItems: 500
        compliance_status:
          $ref: '#/components/schemas/EPRComplianceStatus'
        product_id:
          type: string
          description: The unique identifier of a product
          format: object-id
    FranceProductUniqueIdentificationNumberResponse:
      description: a france product unique identification number response
      allOf:
      - $ref: '#/components/schemas/FranceProductUniqueIdentificationNumber'
      - type: object
        properties:
          id:
            type: string
            description: The unique identifier of a france product unique identification number
            format: object-id
    FranceProductUniqueIdentificationNumber:
      type: object
      description: details of a france product unique identification number
      properties:
        category:
          enum:
          - BATTERIES
          - ELECTRIC_AND_ELECTRONIC_EQUIPMENTS
          - FURNITURE
          - PAPER
          - TEXTILE
          - TIRES
          - PRIMARY_PACKAGING
          - SECONDARY_PACKAGING
          - TOYS
          - GARDEN_DIY
          - SPORTING_AND_RECREATIONAL
          type: string
          description: The enum representing the product category with which the UIN is associated.
        uin:
          minLength: 1
          type: string
          description: The unique identification number(UIN) provided by the merchant
        product_responsibility_organization:
          minLength: 1
          type: string
          description: The name of the UIN provided by the merchant
    APIError:
      required:
      - code
      - message
      type: object
      properties:
        message:
          type: string
        code:
          type: integer
          format: int32
    UpdateFranceProductUniqueIdentificationNumber:
      type: object
      description: details of updating a france product unique identification number
      properties:
        uin:
          minLength: 1
          type: string
          description: The unique identification number(UIN) provided by the merchant
        product_responsibility_organization:
          type: string
          description: The name of the UIN provided by the merchant
    FranceProductComplianceStatusRequest:
      required:
      - product_id
      type: object
      properties:
        unique_identification_number_id:
          type: string
          description: The unique identifier of a unique identification number that is submitted by the merchant for compliance reasons
          format: object-id
        product_id:
          type: string
          description: The unique identifier of a product
          format: object-id
    CreateFranceProductUniqueIdentificationNumber:
      type: object
      description: details of creating a france product unique identification number
      allOf:
      - $ref: '#/components/schemas/FranceProductUniqueIdentificationNumber'
      - required:
        - category
        - uin
        - product_responsibility_organization
        type: object
  parameters:
    uin_id:
      schema:
        type: string
        format: object-id
      required: true
      description: The unique identifier of the france product unique identification number
      name: id
      in: path
