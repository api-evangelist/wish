    get:
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
          description: successfully queried for a product
        '400':
          content:
            application/json:
              examples:
                InvalidParameter:
                  value:
                    message: There is no such product for the merchant.
                    code: '90001'
              schema:
                $ref: '#/components/schemas/APIError'
          description: failed to query for a product
      parameters:
      - required: true
        in: path
        description: ID of the product to query
        name: id
        schema:
          type: string
          format: object-id
      tags:
      - Products
      summary: Get a product
      security:
      - OAuth2:
        - products:read
      operationId: getProduct
