components:
  schemas:
    AddProductVariation:
      type: object
      allOf:
      - $ref: '#/components/schemas/EditableVariationParams'
      - required:
        - sku
        - inventories
        - price
        type: object
    Image:
      type: object
      properties:
        url:
          type: string
          description: The URL of the image of the product.
          format: uri
        variation_skus:
          items:
            minLength: 1
            type: string
          type: array
          description: The list of SKUs of the variations that use this image.</br> `This field will be deprecated soon. To add images to or get images for product variations, use the variations.image field`
        is_clean_image:
          type: boolean
          description: Whether the image is a clean image. Only one clean image URL can be specified for a product. [Learn more](https://merchanthelp.wish.com/s/article/mu360033668153?language=en_US).
    Unit:
      enum:
      - OUNCE
      - POUND
      - MILLIGRAM
      - GRAM
      - KILOGRAM
      - FLUID_OUNCE
      - PINT
      - QUART
      - GALLON
