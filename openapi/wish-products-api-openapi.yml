          description: The requested brand ID of the product. The product must be authentic and directly manufactured by the brand owner. For example, Apple is the Brand of iPhone or iPad but Apple is not the Brand of an iPhone case not manufactured by Apple. Visit [Brand Directory](/branded-products/brand-directory) to view a list of brands to select from or request a new brand to be added.
          format: object-id
        attributes:
          items:
            $ref: '#/components/schemas/Attribute'
          type: array
          description: The custom attributes of the product. Merchants may use the "name" and "value" fields here to add specific attributes for the product’s category. Our [Taxonomy APIs](/documentation/api/v3/reference#operation/getCategoryAttributes) contains the list of all attributes for each category, mentions which ones are required, and the corresponding accepted values for each attribute. The required attributes for each category will be enforced when creating a new product listing (Create a Product).
          nullable: true
        category_id:
          type: integer
          description: 'This is used to categorize the listings. This is a required field when creating new product listings (Create a Product). This link has Wish’s category tree with the category IDs: [Link](/md/products/categories)'
        parent_sku:
          minLength: 1
          type: string
          description: The parent Stock Keeping Unit of the product.
          maxLength: 80
        unit:
          type: string
          allOf:
          - $ref: '#/components/schemas/UnitInput'
        name:
          minLength: 1
          type: string
          description: The name of the product.
    Money:
      required:
      - amount
      - currency_code
      type: object
      properties:
        amount:
          format: float
          type: number
          description: Amount in decimals.
          example: 10.4
        currency_code:
          format: iso-4217
          type: string
          description: The 3-letter currency code defined in [ISO 4217](https://www.iso.org/iso-4217-currency-codes.html).
          example: USD
    CreateProduct:
      type: object
      allOf:
      - $ref: '#/components/schemas/EditableProductParams'
      - required:
        - name
        - description
        - parent_sku
        - default_shipping_prices
        type: object
      - required:
        - main_image
        - variations
        type: object
        properties:
          main_image:
            type: object
            description: The main image of the product. Image can be in JPEG, PNG or GIF format. Images should be at least 500 x 500 pixels in size. Maximum size 178 MP and 24MB
            allOf:
            - $ref: '#/components/schemas/CreateImage'
          variations:
            minItems: 1
            items:
              $ref: '#/components/schemas/AddProductVariation'
            type: array
            description: The variations of the product. There must be at least one variation for a product.
            maxItems: 400
          extra_images:
            items:
              $ref: '#/components/schemas/CreateImage'
            type: array
            description: The extra images of the product in addition to the main image. It takes some time for images to be processed.
            maxItems: 100
    ProductVariation:
      type: object
      properties:
        sku:
          minLength: 1
          type: string
          description: The Stock Keeping Unit of the variation.
        status:
          enum:
          - ENABLED
          - DISABLED
          - REMOVED_BY_WISH
          type: string
          description: The status of the variation. Removed variations cannot be updated.
        quantity_value:
          minimum: 0
          type: number
          description: The total quantity of the product variant (in the given unit) that is used to calculate price per unit. Note that if a product has multiple product variants, you will need to set quantity values for each product variant. [Learn More](https://merchantfaq.wish.com/hc/en-us/articles/4405383750555).
          format: float
        product_id:
          readOnly: true
          type: string
          description: The ID of the product.
          format: object-id
        image:
          type: string
          description: The URL of the image associated with the variation.
          format: uri
        options:
          items:
            $ref: '#/components/schemas/Option'
          type: array
          description: Parameters used to define the variations. Each combination of option values may be a variation for that product.
        price:
          type: object
          description: The price of the variation.
          allOf:
          - $ref: '#/components/schemas/Price'
        cost:
          type: object
          description: The cost of the variation.
          allOf:
          - $ref: '#/components/schemas/Price'
        gtin:
          type: string
          description: The Global Trade Item Number of the product.
        request_id:
          readOnly: true
          type: string
          description: Identifier for the variation create request. Can be used with the [Get Product Create or Update Request endpoint](/documentation/api/v3/reference#operation/getProductUpdateRequest) to track the status of the request during the Automated Listing Review process.
        attributes:
          items:
            $ref: '#/components/schemas/AttributeResponse'
          type: array
          description: The custom attributes of the variation.
          nullable: true
        inventories:
          items:
            $ref: '#/components/schemas/WarehouseInventory'
          type: array
          description: The inventory of the variation in each warehouse.
        id:
          readOnly: true
          type: string
          description: The ID of the variation.
          format: object-id
        logistics_details:
          type: object
          description: The logistics details of the variation.
          allOf:
          - $ref: '#/components/schemas/LogisticsInfo'
    UpdateDefaultShipping:
      type: object
      allOf:
      - $ref: '#/components/schemas/DefaultShipping'
      - required:
        - default_shipping_price
        - warehouse_id
        type: object
    WarningType:
      enum:
      - CHEMICAL
      - FOOD
      - FURNITURE
      - ON_PRODUCT_CANCER
      - ON_PRODUCT_COMBINED_CANCER_REPRODUCTIVE
      - ON_PRODUCT_REPRODUCTIVE
      - RAW_WOOD
      - DIESEL_ENGINE
      type: string
      description: The warning type applicable to your product, if any, for compliance with [California Proposition 65](https://www.p65warnings.ca.gov/). For more information on California Proposition 65 compliance, please see this Help Center article, "[California Proposition 65 overview and warning notices](https://merchantfaq.wish.com/hc/en-us/articles/360025359874)."
    CalculatedShipping:
      type: object
      properties:
        enable:
          type: boolean
          description: To enable or disable Calculated Shipping for this product.
    UpdateProductVariation:
      type: object
      allOf:
      - $ref: '#/components/schemas/EditableVariationParams'
      - required:
        - id
        type: object
        properties:
          status:
            enum:
            - ENABLED
            - DISABLED
            type: string
            description: The status of the variation. Removed variations cannot be updated.
          id:
            type: string
            description: The ID of the variation.
            format: object-id
    DefaultShipping:
      type: object
      properties:
        default_shipping_price:
          type: object
          description: The default shipping price for a product in a warehouse.
          allOf:
          - $ref: '#/components/schemas/Price'
        warehouse_id:
          type: string
          description: The ID of the warehouse.
          format: object-id
    UpdateProduct:
      type: object
      allOf:
      - $ref: '#/components/schemas/EditableProductParams'
      - type: object
        properties:
          status:
            enum:
            - ENABLED
            - DISABLED
            type: string
            description: The status of the product.
          first_mile_shippings:
            items:
              $ref: '#/components/schemas/ProductUpdateAdvancedLogisticsShipping'
            type: array
            description: The first-mile shipping price and unification initiative statuses of the product in each warehouse. Provide at least one of `effective_first_mile_shipping` or `enabled` to change the first-mile shipping price or switch the unification initiative status respectively. Only applicable to Mainland China-based merchants whose products have destination countries supported by Wish’s unification initiative. Please refer to /api/v3/unification_initiative/countries for the full list of support countries.
          main_image:
            type: object
            description: The main image of the product. Image can be in JPEG, PNG or GIF format. Images should be at least 500 x 500 pixels in size. Maximum size 178 MP and 24MB
            allOf:
            - $ref: '#/components/schemas/CreateImage'
          variations:
            minItems: 0
            items:
              $ref: '#/components/schemas/UpdateProductVariation'
            type: array
            description: The variations of the product.
            maxItems: 400
          extra_images:
            items:
              $ref: '#/components/schemas/CreateImage'
            type: array
            description: The extra images of the product in addition to the main image. It takes some time for images to be processed.
            maxItems: 100
            nullable: true
    GPSRManufacturer:
      type: object
      properties:
        email:
          type: string
          description: The Email of the manufacture of the product.
        name:
          type: string
          description: The Name of the manufacture of the product.
        address:
          type: string
          description: The Address of the manufacture of the product.
    LogisticsInfo:
      type: object
      properties:
        customs_declared_name:
          type: string
          description: Declared name of the product used for customs clearance. This is often displayed on the product packaging.
        origin_country:
          type: string
          description: Country where the product is manufactured, produced, or grown. Country code should follow [ISO 3166 Alpha-2 code](https://www.iso.org/obp/ui/#iso:pub:PUB500001:en). This is a required field when creating a new product listing (Create a Product) or creating a new variation (Create a variation).
          format: iso-3166
        weight:
          type: number
          description: The weight of the package in which your product will ship to the customer (units in grams).</br> This is a required field for mainland China-based merchants when creating a new product listing (Create a Product) or adding variations to existing product listings (Create a variation).
          format: float
        restricted_flags:
          items:
            enum:
            - HAS_POWDER
            - HAS_LIQUID
            - HAS_BATTERY
            - HAS_METAL
            type: string
          type: array
          description: Whether the product contains certain items or materials.</br> __Battery__ - Products that contain batteries, either replaceable or built into the product.</br> __Liquid__ - Products that consist of a substance that has a consistency like water or oil, including semi-liquids such as creams, gels, lubes, etc.</br> __Metal__ - Products made of or containing metal as a material component.</br> __Powder__ - Any product that is composed of fine, dry particles.
          nullable: true
        customs_hs_code:
          type: string
          description: Harmonization System Code for customs declaration.
        height:
          type: number
          description: The height of the package in which your product will ship to the customer (units in cm).
          format: float
        width:
          type: number
          description: The width of the package in which your product will ship to the customer (units in cm).
          format: float
        length:
          type: number
          description: The length of the package in which your product will ship to the customer (units in cm).
          format: float
        declared_name:
          type: string
          description: The product name for customs declaration.</br> `This field will be deprecated soon and replaced with customs_declared_name.`
        customs_declared_value:
          type: object
          description: The price of the product for customs declaration.
          allOf:
          - $ref: '#/components/schemas/Price'
        pieces:
          type: integer
          description: The number of pieces associated with the variation.
        declared_local_name:
          type: string
          description: The product name in local language for customs declaration.
    CountryShippingDetail:
      required:
      - overrides
      - destination
      type: object
      properties:
        is_enabled:
          default: true
          type: boolean
          description: Whether shipping is enabled for the country.
        max_delivery_days:
          type: integer
          description: The maximum days for a product to be delivered to the customer. Can be set to null to remove the current max_delivery_days.
          nullable: true
        overrides:
          items:
            $ref: '#/components/schemas/RegionShippingDetail'
          type: array
          description: The region shipping detail.
        destination:
          format: iso-3166
          type: string
          description: The 2-letter country code defined in [ISO 3166](https://www.iso.org/iso-3166-country-codes.html).
          example: US
        additional_price:
          type: object
          description: The additional shipping price for the country. Additional shipping price should be always smaller than or equal to shipping price.
          allOf:
          - $ref: '#/components/schemas/Price'
        price:
          type: object
          description: The shipping price for the country.
          allOf:
          - $ref: '#/components/schemas/Price'
    WarehouseInventory:
      required:
      - warehouse_id
      - inventory
      type: object
      properties:
        inventory:
          minimum: 0
          type: integer
          description: The inventory of a variation in the warehouse.
          maximum: 500000
        warehouse_id:
          type: string
          description: The ID of the warehouse.
          format: object-id
    ListShallowProductsResponse:
      items:
        $ref: '#/components/schemas/ShallowProduct'
      type: array
      description: The list of products without nested data.
    Attribute:
      required:
      - name
      type: object
      properties:
        name:
          type: string
          description: The name of the attribute. Input the relevant "name" here. Please browse our [Taxonomy APIs](/documentation/api/v3/reference#operation/getCategoryAttributes) for possible attribute names.
        value:
          items:
            type: string
          type: array
          description: The value of the attribute. Can be set to null to remove the attribute. Input the relevant value here from the "accepted_values" here. Please browse our [Taxonomy APIs](/documentation/api/v3/reference#operation/getCategoryAttributes) for possible attribute values.
          nullable: true
    WarehouseToShipping:
      required:
      - warehouse_id
      - shipping_details
      type: object
      properties:
        shipping_details:
          items:
            $ref: '#/components/schemas/CountryShippingDetail'
          type: array
          description: The shipping details of a product in a warehouse.
        warehouse_id:
          type: string
          description: The ID of the warehouse.
          format: object-id
  parameters:
    param_updated_at_min:
      schema:
        type: string
        format: date-time
      required: false
      description: Only return products that were updated since the given time. Currently only time with precision up to 'millisecond' will be accepted. Any time that is more precise than 'millisecond' level will be processed so that it only keeps its 'millisecond'.
      name: updated_at_min
      in: query
    param_state:
      schema:
        enum:
        - ACTIVE
        - WISH_INACTIVE
        - MERCHANT_INACTIVE
        - REMOVED_BY_WISH
        - REMOVED_BY_MERCHANT
        type: string
      required: false
      description: Only return products with the given states. Default to all states if null.</br> __ACTIVE__ - state reflects listings that are live. Note that edits to these listings might still be under review and might not be live.</br> __WISH_INACTIVE__ - state reflects listings that are being processed and not live yet. This could likely be because the listing is under product review.</br> __MERCHANT_INACTIVE__ - are listings disabled by the merchant.</br> __REMOVED_BY_WISH__ - are listings removed by Wish.</br> __REMOVED_BY_MERCHANT__ - are listings that are removed by the merchant.
      name: state
      in: query
    param_product_update_request_sort_by:
      schema:
        default: created_at.asc
        pattern: ^(product_id|created_at)(\.(asc|desc))?$
        type: string
      required: false
      description: The attribute to sort product create or update requests in the response.
      name: sort_by
      in: query
    param_min_created_at:
      schema:
        type: string
        format: date-time
      required: false
      description: Only return product create or update requests that were created since the given time.
      name: min_created_at
      in: query
    param_created_at_min:
      schema:
        type: string
        format: date-time
      required: false
      description: Only return products that were created since the given time. Currently only time with precision up to 'second' will be accepted. Any time that is more precise than 'second' level will be processed so that it only keeps its 'second'.
      name: created_at_min
      in: query
    param_sort_by:
      schema:
        default: updated_at.desc
        pattern: ^(updated_at|created_at)(\.(asc|desc))?$
        type: string
      required: false
      description: The attribute to sort products in the response. The most recently updated products will be returned first if `desc`.
      name: sort_by
      in: query
    param_max_created_at:
      schema:
        type: string
        format: date-time
      required: false
      description: Only return product create or update requests that were created before the given time.
      name: max_created_at
      in: query
    param_created_at_max:
      schema:
        type: string
        format: date-time
      required: false
      description: Only return products that were created before the given time. Currently only time with precision up to 'second' will be accepted. Any time that is more precise than 'second' level will be processed so that it only keeps its 'second'.
      name: created_at_max
      in: query
    param_limit:
      schema:
        default: 50
        minimum: 1
        type: integer
        maximum: 1000
      required: false
      description: The limit on the number of products that will be returned.
      name: limit
      in: query
    param_updated_at_max:
      schema:
        type: string
        format: date-time
      required: false
      description: Only return products that were updated before the given time. Currently only time with precision up to 'millisecond' will be accepted. Any time that is more precise than 'millisecond' level will be processed so that it only keeps its 'millisecond'.
      name: updated_at_max
      in: query
    param_product_update_request_statuses:
      schema:
        minItems: 1
        items:
          enum:
          - APPROVED
          - BLOCKED
          - UNDER_REVIEW
          type: string
        type: array
      required: false
      description: Only return product create or update requests with the given statuses.
      name: statuses
      in: query
    param_parent_sku:
      schema:
        type: string
      required: false
      description: The parent sku of the product that will be returned.
      name: parent_sku
      in: query
    param_statuses:
      schema:
        minItems: 1
        items:
          enum:
          - PENDING_REVIEW
          - APPROVED
          - REJECTED
          - REMOVED_BY_WISH
          - REMOVED_BY_MERCHANT
          type: string
        type: array
      required: false
      description: Only return products with the given statuses. Default to PENDING_REVIEW + APPROVED.</br> `This field will be deprecated soon and replaced with state.`
      name: statuses
      in: query
    param_id:
      schema:
        type: string
      required: false
      description: Only return the product create or update request with the given ID.
      name: id
      in: query
    param_product_id:
      schema:
        type: string
        format: object-id
      required: false
      description: Only return the product create or update request for the given product ID.
      name: product_id
      in: query
  securitySchemes:
    OpenID:
      type: openIdConnect
      openIdConnectUrl: https://merchant.wish.com/oidc/.well-known/openid-configuration
    OAuth2:
      type: oauth2
      flows:
        authorizationCode:
          scopes:
            payments:write: Update payments
