components:
  schemas:
    GermanyProductEprRegistrationNumberResponse:
      description: A Germany product EPR registration number response
      allOf:
      - $ref: '#/components/schemas/GermanyProductEprRegistrationNumber'
      - type: object
        properties:
          id:
            type: string
            description: The unique identifier of a Germany product EPR registration number
            format: object-id
    APIError:
      required:
      - code
      - message
      type: object
      properties:
        message:
          type: string
        code:
          type: integer
          format: int32
    GermanyEPRComplianceStatus:
      enum:
      - EPR_REGISTRATION_NUMBER_LINKED
      - NO_EPR_REGISTRATION_NUMBER
      - NOT_RECOMMENDED_TO_LINK_EPR_REGISTRATION
      type: string
      description: ' 3 status: (1) an EPR registration number linked, (2) no EPR registration number, (3) not recommended to link an EPR registration.'
    UpdateGermanyProductEprRegistrationNumber:
      type: object
      description: Details of updating a Germany product EPR registration number
      properties:
        epr_number:
          minLength: 1
          type: string
          description: The EPR registration number provided by the merchant
        organization_or_representative_name:
          type: string
          description: The name of the product responsibility organization (PRO) [required for category PACKAGING] or the Authorized Representative (AR) [optional for category ELECTRIC_AND_ELECTRONIC_EQUIPMENTS and BATTERIES]
    GermanyProductComplianceStatusResponse:
      items:
        $ref: '#/components/schemas/GermanyProductComplianceStatus'
      type: array
      description: List of objects including a product id, compliance status and EPR number id.
    GermanyProductEprRegistrationNumber:
      type: object
      description: Details of a Germany product EPR registration number
      properties:
        category:
          enum:
          - BATTERIES
          - ELECTRIC_AND_ELECTRONIC_EQUIPMENTS
          - PACKAGING
          type: string
          description: The enum representing the product category with which the EPR number is associated.
        epr_number:
          minLength: 1
          type: string
          description: The EPR registration number provided by the merchant
        organization_or_representative_name:
          type: string
          description: The name of the product responsibility organization (PRO) [required for category PACKAGING] or the Authorized Representative (AR) [optional for category ELECTRIC_AND_ELECTRONIC_EQUIPMENTS and BATTERIES]
    CreateGermanyProductEprRegistrationNumber:
      type: object
      description: Details of creating a Germany product EPR registration number
      allOf:
      - $ref: '#/components/schemas/GermanyProductEprRegistrationNumber'
      - required:
        - category
        - epr_number
        type: object
    ListGermanyProductEprRegistrationNumbersResponse:
      items:
        $ref: '#/components/schemas/GermanyProductEprRegistrationNumberResponse'
      type: array
      description: List of Germany Product EPR Registration Numbers returned
    GermanyProductComplianceStatus:
      type: object
      properties:
        compliance_status:
          $ref: '#/components/schemas/GermanyEPRComplianceStatus'
        product_id:
          type: string
          description: The unique identifier of a product
          format: object-id
        epr_registration_number_ids:
          items:
            type: string
            description: The unique identifiers of Germany product EPR registration number
            format: object-id
          type: array
          description: List of unique identifier of EPR registration numbers that are submitted by the merchant for compliance reasons
          maxItems: 500
    GermanyProductComplianceStatusRequest:
      required:
      - product_id
      type: object
      properties:
        product_id:
          type: string
          description: The unique identifier of a product
          format: object-id
        epr_registration_number_id:
          type: string
          description: The unique identifier of an EPR registration number that is submitted by the merchant for compliance reasons
          format: object-id
  parameters:
    de_epr_id:
      schema:
        type: string
        format: object-id
      required: true
      description: The unique identifier of the Germany product EPR registration number
      name: id
      in: path
