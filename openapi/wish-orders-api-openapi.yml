components:
  schemas:
    FulfillmentEventType:
      enum:
      - ORDER_RELEASED
      - MARK_SHIPPED
      - CONFIRM_FULFILLED
      - CONFIRMED_DELIVERED
      - TRACKING_CANCELLED
      - ORDER_RE_RELEASED
      type: string
      description: The type of fulfillment milestone
    EORI:
      type: object
      description: Information for the EORI
      properties:
        number:
          type: string
          description: The number itself
        entity:
          $ref: '#/components/schemas/TaxEntity'
    Price:
      required:
      - amount
      - currency_code
      type: object
      properties:
        amount:
          minimum: 0
          type: number
          description: Non-negative amount in decimals.
          format: float
        currency_code:
          format: iso-4217
          type: string
          description: The 3-letter currency code defined in [ISO 4217](https://www.iso.org/iso-4217-currency-codes.html).
          example: USD
    RevShareRegion:
      enum:
      - NORTH_AMERICA
      - EUROPEAN_UNION
      type: string
      description: 'The region used to determine rev_share

        '
    SpecialProgramsInfo:
      type: object
      description: Special program info
      properties:
        status:
          enum:
          - PENDING
          - SUCCEED
          - FAILED
          type: string
          description: The status of the special program. Depending on the specific special program, the merchant/ERP might need to act differently if necessary. For example, for the auto-fulfillment special program, when the status is FAILED, the merchant/ERP would need to fulfill the order as usual since the uni-inventory auto-fulfillment failed.
        display_name:
          type: string
          description: The display name for the special program
    APIError:
      required:
      - code
      - message
      type: object
      properties:
        message:
          type: string
        code:
          type: integer
          format: int32
    TrackingInfo:
      type: object
      description: Tracking information
      properties:
        tracking_number:
          type: string
          description: This is the number a customer can use to track their package with your carrier
        origin_country:
          type: string
          description: Returns country of origin as entered during fulfillment.
          format: iso-3166
        ship_note:
          type: string
          description: A note to yourself when you marked the order as shipped (if applicable)
          maxLength: 500
        shipping_provider:
          $ref: '#/components/schemas/ShippingProvider'
    WarehouseInformation:
      type: object
      description: Warehouse information
      properties:
        warehouse_type:
          $ref: '#/components/schemas/MerchantWarehouseType'
        warehouse_name:
          type: string
          description: warehouse name, as given by merchant
        warehouse_id:
          type: string
          description: ID of the warehouse.
          format: object-id
        fbw_information:
          type: object
          description: Fulfilled by Wish information
          properties:
            fbw_warehouse_code:
              type: string
              description: fbw warehouse code
            fbw_fees:
              items:
                $ref: '#/components/schemas/FBWFee'
              type: array
              description: List of FBW fees
            lot_information:
              items:
                $ref: '#/components/schemas/LotInfo'
              type: array
              description: List of FBW lot info
    UpdateOrder:
      type: object
      properties:
        delivery_receipt_file_url:
          minLength: 1
          type: string
          description: Delivery receipt file URL (Optional if entering carrier tracking link). for less-than-truckload orders only
          maxLength: 300
        delivered_at:
          type: string
          description: The delivery time as it appears on the delivery receipt or tracking link for less-than-truckload orders which are not confirmed fulfilled by carrier tracking within 2 days after the merchant marks the LTL order as shipped. Merchants will have a max of 90 calendar days since mark “ship” to upload delivery confirmation.
          format: date-time
        tracking_url:
          minLength: 1
          type: string
          description: Carrier tracking link (optional if uploading receipt). for less-than-truckload orders only
          maxLength: 300
    OrderType:
      enum:
      - WISH_EXPRESS
      - FULFILLED_BY_WISH
      - FULFILLED_BY_STORE
      - LESS_THAN_TRUCKLOAD
      - PREMIUM_SHIPPING_CARRIER_UPGRADE
      - ADVANCED_LOGISTICS
      - OPTIONAL_ADVANCED_LOGISTICS
      - CONFIRMED_DELIVERY_POLICY
      - VAT
      - PC-VAT
      - UNIFICATION_INITIATIVE
      - MAX_DELIVERY_DAY_REQUIREMENT
      - CALCULATED_SHIPPING
      - WISH_PLUS
      type: string
      description: Order type
    VATAdditionalMaterial:
      enum:
      - PACKAGE_OVERVIEW_DOCUMENT
      type: string
      description: VAT additional material
    UpdateTracking:
      required:
      - shipping_provider
      - tracking_number
      - origin_country
      type: object
      properties:
        tracking_number:
          minLength: 1
          type: string
          description: The unique identifier that your carrier provided so that the user can track their package as it is being delivered. Tracking number should only contain alphanumeric characters with no space between them.
        origin_country:
          type: string
          description: Country code of the country the order is being shipped from. The 2-letter country codes are defined in [ISO 3166](https://www.iso.org/iso-3166-country-codes.html).
          format: iso-3166
        ship_note:
          minLength: 1
          type: string
          description: A note to yourself when you marked the order as shipped.
        shipping_provider:
          type: string
          description: The carrier that will be shipping your package to its destination
    PhoneNumber:
      required:
      - number
      type: object
      properties:
        number:
          type: string
          description: The phone number.
        country_code:
          type: string
          description: Country code of the phone number
    AddressWithPhone:
      allOf:
      - $ref: '#/components/schemas/Address'
      - type: object
        properties:
          phone_number:
            type: object
            description: phone number
            allOf:
            - $ref: '#/components/schemas/PhoneNumber'
    VAT:
      type: object
      description: VAT info
      properties:
        eu_vat_customs_declaration:
          type: object
          allOf:
          - $ref: '#/components/schemas/EUVATCustomsDeclaration'
        vat_amount:
          type: object
          allOf:
          - $ref: '#/components/schemas/VATAmount'
        country_code:
          type: string
          description: the name of relevant country. The 2-letter country codes are defined in [ISO 3166](https://www.iso.org/iso-3166-country-codes.html).
          format: iso-3166
        required_vat_numbers:
          type: object
          description: If the order is subject to VAT, this field will return permissible VAT numbers for that country's requirements.
          properties:
            voec:
              $ref: '#/components/schemas/VOEC'
            eori:
              $ref: '#/components/schemas/EORI'
            vat:
              $ref: '#/components/schemas/RequiredVATNumber'
