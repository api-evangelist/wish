        1. APPROVED: Order is ready to be shipped.

        2. SHIPPED: Order has been shipped.

        3. REFUNDED: Order has been refunded.

        4. REQUIRE_REVIEW: Order has been placed under review by Wish. No merchant action required.

        5. DECLINED: Customer''s payment had an issue for this order. No merchant action required.


        Please note, orders can become APPROVED again after reaching states such as REFUNDED or SHIPPED. For more details on these orders, please refer to fulfillment_milestone_record attribute.

