        2. PCCC: Personal Customs Clearance Code - South Korea''s customer identity number

        3. RUT: Rol Único Nacional - Chile''s customer identity number

        4. PASSPORT: For customers that do not have the specific customer identity number, they may provide their passport number instead

        '
    RemitType:
      enum:
      - WISH_REMIT
      - MERCHANT_REMIT
      - TBD_REMIT
      type: string
      description: 'Displays who should remit taxes for this order.


        1. WISH_REMIT: Wish will remit.

        2. MERCHANT_REMIT: Merchant will remit.

        3. TBD_REMIT: UK-specific; this will resolve into WISH_REMIT or MERCHANT_REMIT once the order is shipped."

        '
    PlatformEntity:
      enum:
      - RESELLER
      - OWNER
      type: string
      description: Indicates if the platform (Wish) is the reseller or the owner of the product
    RefundsInfo:
      type: object
      description: Refund info
      properties:
        refund_reason_note:
          type: string
          description: The reason note to the user explaining reason for the refund
        refund_source:
          $ref: '#/components/schemas/RefundSource'
        refund_amount:
          type: object
          description: Refund amount
          allOf:
          - $ref: '#/components/schemas/Money'
        merchant_responsible_amount:
          type: object
          description: The refund amount for which the merchant is responsible
          allOf:
          - $ref: '#/components/schemas/Money'
        refund_time:
          type: string
          description: The time when the order was refunded.
          format: date-time
        refund_reason:
          type: string
          description: The reason the order was refunded
    CustomerPaidPricesDetail:
      type: object
      description: Customer paid price of an order after various adjustments
      properties:
        total:
          type: object
          description: Total
          allOf:
          - $ref: '#/components/schemas/Price'
        product_price:
          type: object
          description: Product price
          allOf:
          - $ref: '#/components/schemas/Price'
        product_price_total:
          type: object
          description: Product price total
          allOf:
          - $ref: '#/components/schemas/Price'
        shipping_price:
          type: object
          description: Shipping price
          allOf:
          - $ref: '#/components/schemas/Price'
        shipping_price_total:
          type: object
          description: Shipping price total
          allOf:
          - $ref: '#/components/schemas/Price'
    FBWFeeType:
      enum:
      - PER_MONTH
      - PER_SHIPPING_PLAN
      - PER_SKU
      - PER_ORDER
      - PER_RETURN_SHIPMENT
      - SHIPPING_PLAN_HANDLING_FEE
      - SHIPPING_PLAN_SORTING_FEE
      - ORDER_SHIPPING_FEE
      - ORDER_HANDLING_FEE
      - ORDER_REPACKAGING_FEE
      - STORAGE_FEE
      - RETURN_EXIT_INVENTORY_SHIPPING_FEE
      - RETURN_EXIT_INVENTORY_HANDLING_FEE
      - RETURNED_ORDER_STORAGE_FEE
      - RETURNED_ORDER_HANDLING
      - RETURNED_ORDER_DISPOSAL_FEE
      - FBS_SERVICE_FEE
      type: string
      description: FBW Fee type
    VATPayer:
      type: object
      description: Information about the payer of VAT
      properties:
        ioss_number:
          type: string
          description: Indicates the IOSS number of VAT payer. For more details, please refer to https://ec.europa.eu/taxation_customs/business/vat/ioss_en
        tax_number:
          type: string
          description: Indicates the tax number of VAT payer. Only displaying merchant tax number for EU PC VAT orders
        name:
          type: string
          description: Indicates the name of VAT payer
        address:
          description: Indicates the address of VAT payer
          allOf:
          - $ref: '#/components/schemas/Address'
    ProcessingStatus:
      enum:
      - IN_PROGRESS
      - FAILED
      - SUCCEEDED
      type: string
      description: Reflects the progress of the action shown in processing_source. The attribute will be empty until V3 PUT endpoints are released later this year.
    FulfillmentEvent:
      type: object
      description: Fulfillment event
      properties:
        event_type:
          $ref: '#/components/schemas/FulfillmentEventType'
        event_time:
          type: string
          description: Date and time of the fulfillment milestone
          format: date-time
    OrderAddress:
      allOf:
      - $ref: '#/components/schemas/AddressWithPhone'
      - type: object
        properties:
          region:
            type: string
            description: Region name. This is only for Chile.
    RefundReasons:
      items:
        $ref: '#/components/schemas/RefundReason'
      type: array
      description: List of valid refund reasons
    LotInfo:
      type: object
      description: FBW lot info
      properties:
        lot_id:
          type: string
          description: lot id
        quantity:
          type: integer
          description: lot quantity
  parameters:
    order_id:
      schema:
        type: string
        format: object-id
      required: true
      description: Wish's unique identifier for the order
      name: id
      in: path
    order_type_for_carrier_list:
      schema:
        enum:
        - GENERAL
        - CONFIRMED_DELIVERY
        type: string
      required: true
      description: 'Choose the specific order type to get a list of approved carriers for. Current values include:

        1. GENERAL: All accepted shipping carriers on Wish

        2. CONFIRMED_DELIVERY: All accepted shipping carriers for Confirmed Delivery Policy. CONFIRMED_DELIVERY is a subset of the carrier list for GENERAL.

        '
      name: order_type
      in: query
    updated_at_max:
      description: Specify the end of the time window to view orders by last order update. Orders updated after this time will not show.
      required: false
      name: updated_at_max
      in: query
      example: '2020-01-01T07:00:00.000Z'
      schema:
        type: string
        format: date-time
    released_at_min:
      description: Specify the beginning of the time window to view desired orders when filtering by order release time. Orders released before this time will not show.
      required: false
      name: released_at_min
      in: query
      example: '2020-01-01T07:00:00.000Z'
      schema:
        type: string
        format: date-time
    order_type:
      schema:
        $ref: '#/components/schemas/OrderTypeFilter'
      required: false
      description: 'Choose the specific programs to filter output orders by. Current input values are:

        1. WISH_EXPRESS

        2. FULFILLED_BY_WISH

        3. FULFILLED_BY_STORE

        4. LESS_THAN_TRUCKLOAD

        5. ADVANCED_LOGISTICS

        6. WISH_PLUS


        Note: This parameter does not support combinations (ex: FULFILLED_BY_WISH & WISH_EXPRESS). If looking for overlaps, query these separately & then manually find the overlap, using Order ID.

        '
      name: order_type
      in: query
    limit:
      schema:
        default: 50
        minimum: 1
        type: integer
        maximum: 500
      required: false
      description: Specify a limit on the number of orders that can be returned.
      name: limit
      in: query
    released_at_max:
      description: Specify the end of the time window to view desired orders when filtering by order release time. Orders released after this time will not show.
      required: false
      name: released_at_max
      in: query
      example: '2020-01-01T07:00:00.000Z'
      schema:
        type: string
        format: date-time
    updated_at_min:
      description: Specify the beginning of the window to view orders by last order update. Orders updated before this time will not show.
      required: false
      name: updated_at_min
      in: query
      example: '2020-01-01T07:00:00.000Z'
      schema:
        type: string
        format: date-time
    sort_by:
      schema:
        default: updated_at.desc
        pattern: ^(updated_at|released_at)(\.(asc|desc))?$
        type: string
      required: false
      description: 'Choose which timestamp to filter orders by. Current values are:

        * updated_at: Last time the order was updated.

        * released_at: The time the order was released.

        '
      name: sort_by
      in: query
    limit_order_download_job:
      schema:
        minimum: 1
        type: integer
      required: false
      description: The limit on the number of orders that will be returned.
      name: limit
      in: query
    dest_country:
      schema:
        type: string
        format: iso-3166
      description: Country code of the country the order is being shipped to. For GENERAL order_type, leave this parameter blank. The 2-letter country codes are defined in [ISO 3166](https://www.iso.org/iso-3166-country-codes.html).
      name: dest_country_code
      in: query
    states:
      schema:
        minItems: 1
        items:
          $ref: '#/components/schemas/State'
        type: array
        maxItems: 5
      required: false
      description: '

        Choose the specific order state to filter output orders by. Current input values are:


        1. APPROVED: Order ready to be shipped.

        2. SHIPPED: Order has been shipped.

        3. REFUNDED: Order has been refunded.

        4. REQUIRE_REVIEW: Order has been placed under review

        5. DECLINED: Customer''s payment had an issue for this order

        '
      name: states
      in: query
