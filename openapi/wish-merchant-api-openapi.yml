  /api/v3/merchant/shipping_settings:
    put:
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShippingSettings'
          description: successfully updated shipping prices of a product
        '400':
          content:
            application/json:
              examples:
                CannotDisableShipping:
                  value:
                    message: Cannot disable shipping to one of the countries due to policy reasons
                    code: '10010'
                DuplicateCountryCode:
                  value:
                    message: One of the country codes has been specified more than once.
                    code: '10008'
                BannedMerchant:
                  value:
                    message: Merchant has been banned on Wish.
                    code: '10007'
                InvalidCountryCode:
                  value:
                    message: One of the country codes is invalid or not supported by Wish
                    code: '10009'
              schema:
                $ref: '#/components/schemas/APIError'
          description: failed to update shipping settings
      tags:
      - Merchant
      summary: Update shipping settings
      requestBody:
        content:
          application/json:
