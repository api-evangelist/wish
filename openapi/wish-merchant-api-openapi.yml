components:
  schemas:
    FashionExperience:
      type: object
      properties:
        status:
          enum:
          - ENABLED
          - DISABLED
          type: string
          description: Wish Fashion experience status
    UnificationInitiative:
      type: object
      properties:
        status:
          enum:
          - ENABLED
          - DISABLED
          type: string
          description: Merchant's unification initiative status. Only applicable to Mainland China-based merchants whose products have destination countries included in Wish’s unification initiative enabled.
    WarehouseRequest:
      type: object
      allOf:
      - $ref: '#/components/schemas/WarehouseBase'
      - type: object
        properties:
          destination_countries:
            minItems: 1
            items:
              description: The 2-letter country code defined in [ISO 3166](https://www.iso.org/iso-3166-country-codes.html).
              type: string
              example: US
              format: iso-3166
            type: array
            description: List of country codes representing the destination countries that this warehouse ships to. All countries listed here must be countries that you enabled shipping to at merchant level. The 2-letter country code list is defined in [ISO 3166](https://www.iso.org/iso-3166-country-codes.html).
    UpdateWarehouse:
      type: object
      properties:
        address:
          type: object
          description: Physical address of the warehouse.
          allOf:
          - $ref: '#/components/schemas/WarehouseAddress'
    AccountDetail:
      type: object
      properties:
        status:
          enum:
          - ACTIVE
          - INACTIVE
          type: string
          description: Merchant's account status.
        revenue_type:
          enum:
          - COST_BASED
          - REV_SHARE
          type: string
          description: Indicates the revenue type of a merchant.
        display_name:
          type: string
          description: The name of the merchant account displayed to the public.
        product_boost_status:
          enum:
          - ENROLLED
          - NOT_ENROLLED
          type: string
          description: Indicates the product boost state of a merchant.
    APIError:
      required:
      - code
      - message
      type: object
      properties:
        message:
          type: string
        code:
          type: integer
          format: int32
    WarehouseAddress:
      required:
      - ship_to_name
      - street_address1
      - city
      - country_code
      - zipcode
      type: object
      properties:
        city:
          type: string
          description: City name.
        ship_to_name:
          type: string
          description: Name of the person at this address.
        street_address2:
          type: string
          description: Street address 2.
        street_address1:
          type: string
          description: Street address 1.
        zipcode:
          type: string
          description: Zip code or postal code.
        state:
          type: string
          description: State or province name.
        country_code:
          format: iso-3166
          type: string
          description: The 2-letter country code defined in [ISO 3166](https://www.iso.org/iso-3166-country-codes.html).
          example: US
    UpdateShippingSettings:
      minItems: 1
      items:
        $ref: '#/components/schemas/ShippingSetting'
      type: array
      nullable: true
    Warehouses:
      items:
        type: object
        allOf:
        - $ref: '#/components/schemas/WarehouseResponse'
      type: array
    WarehouseResponse:
      type: object
      allOf:
      - $ref: '#/components/schemas/WarehouseBase'
      - type: object
        properties:
          destination_countries:
            items:
              description: The 2-letter country code defined in [ISO 3166](https://www.iso.org/iso-3166-country-codes.html).
              type: string
              example: US
              format: iso-3166
            readOnly: true
            type: array
            description: List of country codes representing the destination countries that this warehouse ships to. All countries listed here must be countries that you enabled shipping to at merchant level. The 2-letter country code list is defined in [ISO 3166](https://www.iso.org/iso-3166-country-codes.html).
    CreateWarehouse:
      type: object
      allOf:
      - $ref: '#/components/schemas/WarehouseRequest'
      - required:
        - destination_countries
        - name
        - address
        type: object
    ShippingSetting:
      required:
      - country_code
      - enabled
      type: object
      properties:
        enabled:
          type: boolean
          description: Indicate whether shipping to this country is enabled.
        country_code:
          format: iso-3166
          type: string
          description: The country code of the destination country. The 2-letter country codes are defined in [ISO 3166](https://www.iso.org/iso-3166-country-codes.html).
          example: US
    MerchantCurrencySettings:
      type: object
      properties:
        product_boost_currency:
          type: string
          description: The currency code for all your ProductBoost campaigns. The currency codes are defined in [ISO 4217](https://www.iso.org/iso-4217-currency-codes.html).
          example: USD
        localized_currency:
          type: string
          description: The currency code for all your variations, products, and payments. The currency codes are defined in [ISO 4217](https://www.iso.org/iso-4217-currency-codes.html).
          example: USD
    WarehouseBase:
      type: object
      properties:
        shipping_type:
          readOnly: true
          enum:
          - STANDARD
          - WISH_EXPRESS
          type: string
        id:
          readOnly: true
          type: string
          description: Warehouse ID.
          format: object-id
        name:
          minLength: 1
          maxLength: 80
          type: string
          description: The unique name of the warehouse.
          example: STANDARD
        address:
          type: object
          description: Physical address of the warehouse.
          allOf:
          - $ref: '#/components/schemas/WarehouseAddress'
    MerchantSettings:
      type: object
      properties:
        unification_initiative:
          type: object
          description: Merchant's unification initiative status. Only applicable to Mainland China-based merchants whose products have destination countries included in Wish’s unification initiative enabled.
          allOf:
          - $ref: '#/components/schemas/UnificationInitiative'
        fashion_experience:
          type: object
          description: Merchant's fashion experience status. Merchants with this flag enabled are participating in the new Wish Fashion Experience. Learn [More](https://merchantfaq.wish.com/hc/en-us/articles/6817880684315).
          allOf:
          - $ref: '#/components/schemas/FashionExperience'
        automated_listing_review_experience:
          type: object
          description: Merchant's automated listing review experience status. Merchants with this flag enabled are participating in the Automated Listing Review experience. Learn [More](https://merchantfaq.wish.com/hc/en-us/articles/6987354064155).
          allOf:
          - $ref: '#/components/schemas/AutomatedListingReviewExperience'
    ShippingSettings:
      items:
        $ref: '#/components/schemas/ShippingSetting'
      type: array
    AutomatedListingReviewExperience:
      type: object
      properties:
        status:
          enum:
          - ENABLED
          - DISABLED
          type: string
          description: Auotmated Listing Review experience status
  securitySchemes:
    OpenID:
      type: openIdConnect
      openIdConnectUrl: https://merchant.wish.com/oidc/.well-known/openid-configuration
    OAuth2:
      type: oauth2
      flows:
        authorizationCode:
          scopes:
            payments:write: Update payments
            tickets:write: Write customer tickets
            epc:read: read EPC info
            returns:write: Write returns
            returns:read: Read returns
            fbw:read: Read FBW
            products:read: Read products
            payments:read: Read payments
            fbw:write: Write FBW
            merchant:write: Write merchant
            products:write: Write products
            ratings:read: Read ratings
            videos:read: Read videos
            compliance:write: Write Compliance
            product_boost:read: Read ProductBoost
            listing_quality:read: Read listing quality
            webhook:write: Write webhook
            orders:read: Read orders
            compliance:read: Read Compliance
            fbs:read: Read FBS
            penalties:read: Read penalties
            penalties:write: Update penalties
            infractions:read: Read infractions
            orders:write: Update orders
            merchant:read: Read merchant
            notifications:write: Write notifications
            announcements:read: Read announcements
            product_boost:write: Write ProductBoost
            notifications:read: Read notifications
            webhook:read: Read webhook
            qoo10:read: Read Qoo10
            wps_parcel:write: Write WishParcel
            wps_parcel:read: Read WishParcel
            tickets:read: Read customer tickets
            infractions:write: Write infractions
            videos:write: Write videos
            epc:write: write EPC info
          tokenUrl: https://merchant.wish.com/api/v3/oauth/access_token
          refreshUrl: https://merchant.wish.com/api/v3/oauth/refresh_token
          authorizationUrl: https://merchant.wish.com/v3/oauth/authorize
