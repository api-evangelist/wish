      - description: Only return performances for dates at or after this time. Currently only time with precision up to 'date' level in Pacific Time (PT) will be accepted. Any time that is more precise than 'date' level and/or not in PT will be processed so that it only keeps its 'date', in PT. That is, a passed in date-time will be first converted in PT and then its fields other than 'year', 'month', 'day' are ignored.
        required: false
        name: time_min
        in: query
        example: '2020-01-01T07:00:00Z'
        schema:
          type: string
          format: date-time
      - description: Only return performances for dates at or before this time. Currently only time with precision up to 'date' level in Pacific Time (PT) will be accepted. Any time that is more precise than 'date' level and/or not in PT will be processed so that it only keeps its 'date', in PT. That is, a passed in date-time will be first converted in PT and then its fields other than 'year', 'month', 'day' are ignored.
        required: false
        name: time_max
        in: query
        example: '2020-01-01T07:00:00Z'
        schema:
          type: string
          format: date-time
      tags:
