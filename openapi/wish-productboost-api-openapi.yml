openapi: 3.0.0
info:
  contact:
    email: partner-api@wish.com
  x-wish-dev-contact:
    assignee: kwei
    email: marketplace-external-api@contextlogic.com
  description: "\nWish Marketplace V3 API\n\n# General Information\n\n The Wish Marketplace API will be using oAuth to authenticate in order to offer better security for its users\n\n *   Learn about oAuth [here](oauth).\n *   If you are a merchant and want to create an application for yourself, learn about how to create a private app [here](../../private-app)\n *   If you are a ERP and create applications that'll be used by multiple merchants, learn about how to create a public app [here]( ../../public-app). You will need to apply to be a verified public application\n\n ## How to Test\n\n To avoid testing the API on production data, use our sandbox. The sandbox is completely contained and will not affect Wish users or your merchant account. \n \n To reach the sandbox, visit: https://sandbox.merchant.wish.com.\n\n To use the sandbox in testing, use https://sandbox.merchant.wish.com/api/v3/ as your base URL.\n\n How to Generate test data after you have created a sandbox account:\n 1. Navigate to the [unfulfilled orders page](https://sandbox.merchant.wish.com/transactions/action)\n 2. Hover over the dropdown next to the 'fulfill with csv' button and select Generate Orders\n\n ## Date/Time Format\n\n  All dates and times in our API are returned in the same format. It is in the form `YYYY-MM-DDTHH:mm:ss.sss±XX:ZZ` or `YYYY-MM-DDTHH:mm:ss.sssZ`, where 'Z' represents UTC timezone.\n  When sending timestamps in URL parameters or the request body, millisecond is optional and will defaults to 0 if not provided.\n\n  * `YYYY` is the year\n  * `MM` is the month\n  * `DD` is the day\n  * `HH` is the hour (in 24-hour clock format)\n  * `mm` is the minutes\n  * `ss.sss` is the seconds and milliseconds\n  * `±XX:ZZ` is the UTC offset of the form +XX:ZZ or -XX:ZZ where XX is a 2-digit string giving the number of UTC offset hours, and ZZ is a 2-digit string giving the number of UTC offset minutes.\n\n ## Response Schema\n\n  Every response returned from the Wish API will have the same schema. This schema is intended to give you a predictable manner to check the status of your request and know where to get the data. Each response will have the following top level attributes: message, code and data.\n\n  **Attributes**\n\n  <table>\n  <tbody>\n  <tr>\n  <th>Message</th>\n  <td>A message describing the error that happened, example: \"We could not find a product for id: '5d30f60e0a6fc464f4f376b0'\"</td>\n  </tr>\n  <tr>\n  <th>Code</th>\n  <td>A unique number which represents the error that has occurred, example: 1008 or 0 if success.</td>\n  </tr>\n  <tr>\n  <th>Data</th>\n  <td>For errors this will be empty.</td>\n  </tr>\n  </tbody>\n  </table>\n\n ## General Querying Techniques\n\n ### Partial Resources\n All GET endpoints (except OAuth) support a fields parameter which allows for requesting a partial response. Any fields specified in the response schema of an endpoint can be selected. The top level attribute `data` can be ignored when using the fields parameter.\n\n **Syntax**\n * Comma-separated list to select multiple fields\n * Use forward slash `/` to select nested field: `field1/nested_field`\n * Use parentheses `( )` to select multiple nested fields: `field1(nested_field1,nested_field2)`\n * Use `*` for wildcard selection: `field1/nested_field/*`\n\n\n **Example:**\n ```\n https://merchant.wish.com/api/v3/demo/get?fields=title,items(id,info/name)\n ```\n Which would result in the following partial response:\n ```\n {\n   \"title\": \"demo\",\n   \"items\": [\n     {\n       \"id\": \"1\",\n       \"info\": {\n         \"name\": \"demo_item_1\"\n       }\n     }, {\n       \"id\": \"2\",\n       \"info\": {\n         \"name\": \"demo_item_2\"\n       }\n     },\n     ...\n   ]\n }\n ```\n\n ## Locale\n   You can optionally specify locale in order to translate content and error messages into your language.\n   To do this use the [Accept-Language](https://developer.mozilla.org/en-US/docs/Web/HTTP/Headers/Accept-Language) header to specify your preferred locales.\n   If none is provided, your default locale will be used.\n\n   For example, to request content in Chinese use: `Accept-Language: zh`\n\n   In the response, you will receive a [Content-Language](https://developer.mozilla.org/en-US/docs/Web/HTTP/Headers/Content-Language) header that specifies the locale code of the response content.\n\n\n ## Rate-Limiting\n\n  Rate-limiting will be performed on a per-merchant basis for each app. It is your responsibility to ensure you are not making frequent unnecessary calls to the API.\n\n  If the rate limits cannot satisfy your need, we highly recommend integrating webhooks for your app. With webhooks, instead of pulling resources periodically, your app will receive real-time notifications for particular events that occur to a merchant’s store. [Learn more](https://merchant.wish.com/documentation/webhooks)\n\n  **Normal Usage**\n\n  To help you track the rate-limiter status, the following response header(s) will be provided with each response:\n\n   * `Wish-Rate-Limit-Remaining`: The number of calls remaining in the current rate-limiting window.\n\n\n  **Rate-Limit Exceeded**\n\n  After you exceed the number of allowed calls in the current rate-limiting window, you will receive a `429 Too Many Requests` error response and the following additional header(s):\n\n   * `Wish-Rate-Limit-Reset`: The time the rate-limiter will reset.\n\n\n  Once you receive this response there is nothing you can do except wait for the rate-limiter to reset. In order to avoid being rate-limited, you may want to cache your responses.\n\n ## Sorting\n   ### Overview\n   Sorting is available for most endpoints that return a collection (list) of objects. Each collection has a different set of enabled parameters for sorting, so please check specific collection section for detail.\n\n   ### Usage\n   Append `sort_by={parameter_name}.{asc|desc}` in your API request where `parameter_name` is a valid sortable parameter of that endpoint.\n\n   Example:\n   ```\n   /api/v3/penalties?sort_by=created_at.asc\n   ```\n\n ## Pagination\n  All bulk-fetching API methods that return lists of resource support pagination.\n  These methods commonly take at least 3 parameters: `limit`, `{attribute}_min`, `{attribute}_max`. Attribute can be `id`, `create_at`, etc., depending on each specific method.\n  For instance, you make a request to get a list of penalties `/api/v3/penalties?limit=20&created_at_max=2020-04-08T23:59:59Z&sort_by=created_at_max.desc`,\n  which means to fetch 20 penalities sorted by their creation time, with the most recent one being created before `2020-04-08T23:59:59Z`.\n  Assume that the response contains 20 `penalty` objects with the last object being `penalty_foo`,\n  then your subsequent request can be `/api/v3/penalties?limit=20&created_at_max={penalty_foo.create_at}&sort_by=created_at_max.desc` to fetch the next page of list.\n  Note that when fetching next page using `id_min` or `id_max`, you need to perform `+/- 1`(correspondingly) on the last object's ID in the current page, as `id_min` and `id_max` are inclusive. (All V3 API resources' IDs are either integer or BSON object ID - a hex number).\n\n\n ## Request ID\n  Each API request is associated with a unique identifier. You can find this value in response headers, under `Wish-Request-Id`.\n  **When you need to contact us about a specific request, please provide this ID to ensure the fastest possible reply**\n\n# Authentication\nFor all requests that require OAuth2 authentication, the access token must be provided in the `Authorization` request header in the following format: `Authorization: Bearer <token>`\n\nFor example:\n```\nAuthorization: Bearer 3d6e2d71bc464e42bfbdb081afb73c1e\n```\n<!-- ReDoc-Inject: <security-definitions> -->\n"
  version: 3.0.65
  title: Wish Marketplace V3 Brands ProductBoost API
servers:
- url: https://merchant.wish.com
  description: V3 API endpoint
security:
- OAuth2: []
tags:
- name: ProductBoost
paths:
  /api/v3/product_boost/keywords:
    get:
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Keywords'
          description: successfully queried for ProductBoost keywords
        '400':
          content:
            application/json:
              examples:
                InvalidKeywordParameters:
                  value:
                    message: Invalid 'keywords' parameter.
                    code: '20501'
              schema:
                $ref: '#/components/schemas/APIError'
          description: failed to query for ProductBoost keywords
      parameters:
      - required: false
        in: query
        description: A list of keywords. Maximum 50 keywords allowed. Only one of 'keywords' and 'query' parameters should be provided. 'keywords' parameter does exact match while 'query' returns all matching keywords.
        name: keywords
        schema:
          minItems: 1
          items:
            type: string
            format: string
          type: array
          maxItems: 50
      - required: false
        in: query
        description: The query used to search all related keywords. Only one of 'keywords' and 'query' parameters should be provided. 'keywords' parameter does exact match while 'query' returns all matching keyword.
        name: query
        schema:
          type: string
      - required: false
        in: query
        description: A list of keywords to be excluded from the search results. Maximum 30 allowed. This parameter is only in use if 'query' parameter is provided.
        name: exclude
        schema:
          minItems: 0
          items:
            type: string
          type: array
          maxItems: 30
      tags:
      - ProductBoost
      summary: Get information for the given keywords or keywords that match the query
      security:
      - OAuth2:
        - product_boost:read
      operationId: getKeywords
      x-code-samples:
      - lang: python_requests
        source: 'import requests


          url = "https://merchant.wish.com/api/v3/product_boost/keywords"


          querystring = {"keywords":"SOME_ARRAY_VALUE","query":"SOME_STRING_VALUE","exclude":"SOME_ARRAY_VALUE"}


          headers = {''authorization'': ''Bearer REPLACE_BEARER_TOKEN''}


          response = requests.request("GET", url, headers=headers, params=querystring)


          print(response.text)'
      - lang: javascript_jquery
        source: "var settings = {\n  \"async\": true,\n  \"crossDomain\": true,\n  \"url\": \"https://merchant.wish.com/api/v3/product_boost/keywords?keywords=SOME_ARRAY_VALUE&query=SOME_STRING_VALUE&exclude=SOME_ARRAY_VALUE\",\n  \"method\": \"GET\",\n  \"headers\": {\n    \"authorization\": \"Bearer REPLACE_BEARER_TOKEN\"\n  }\n}\n\n$.ajax(settings).done(function (response) {\n  console.log(response);\n});"
      - lang: php_curl
        source: "<?php\n\n$curl = curl_init();\n\ncurl_setopt_array($curl, array(\n  CURLOPT_URL => \"https://merchant.wish.com/api/v3/product_boost/keywords?keywords=SOME_ARRAY_VALUE&query=SOME_STRING_VALUE&exclude=SOME_ARRAY_VALUE\",\n  CURLOPT_RETURNTRANSFER => true,\n  CURLOPT_ENCODING => \"\",\n  CURLOPT_MAXREDIRS => 10,\n  CURLOPT_TIMEOUT => 30,\n  CURLOPT_HTTP_VERSION => CURL_HTTP_VERSION_1_1,\n  CURLOPT_CUSTOMREQUEST => \"GET\",\n  CURLOPT_HTTPHEADER => array(\n    \"authorization: Bearer REPLACE_BEARER_TOKEN\"\n  ),\n));\n\n$response = curl_exec($curl);\n$err = curl_error($curl);\n\ncurl_close($curl);\n\nif ($err) {\n  echo \"cURL Error #:\" . $err;\n} else {\n  echo $response;\n}"
      - lang: shell_curl
        source: "curl --request GET \\\n  --url 'https://merchant.wish.com/api/v3/product_boost/keywords?keywords=SOME_ARRAY_VALUE&query=SOME_STRING_VALUE&exclude=SOME_ARRAY_VALUE' \\\n  --header 'authorization: Bearer REPLACE_BEARER_TOKEN'"
      - lang: java_unirest
        source: "HttpResponse<String> response = Unirest.get(\"https://merchant.wish.com/api/v3/product_boost/keywords?keywords=SOME_ARRAY_VALUE&query=SOME_STRING_VALUE&exclude=SOME_ARRAY_VALUE\")\n  .header(\"authorization\", \"Bearer REPLACE_BEARER_TOKEN\")\n  .asString();"
      description: Obtain details on a list of ProductBoost keywords.
  /api/v3/product_boost/campaigns:
    post:
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Campaign'
          description: successfully created a campaign
        '400':
          content:
            application/json:
              examples:
                NotEnoughBalance:
                  value:
                    message: Maximum allowed spending is too low to run this campaign.
                    code: '20810'
                ProductsInOtherCampaigns:
                  value:
                    message: All products listed under 'products' attribute appear in one or more overlapping campaigns.
                    code: '20821'
                KeywordTooLong:
                  value:
                    message: The keyword is too long.
                    code: '20806'
                TooManyKeywords:
                  value:
                    message: '''keywords'' attribute under ''products'' has too many words listed.'
                    code: '20805'
                NotJoinedProductBoost:
                  value:
                    message: The merchant has not joined ProductBoost yet.
                    code: '20002'
                InvalidBudget:
                  value:
                    message: One of 'max_budget' and 'merchant_budget' fields must be provided.
                    code: '20823'
                BudgetHigherThanMaximum:
                  value:
                    message: Campaign budget exceeds maximum allowed spending.
                    code: '20812'
                InvalidScheduledAddBudgetDays:
                  value:
                    message: Invalid 'scheduled_add_budget_days' parameter. 'scheduled_add_budget_days' must be a JSON array with values ranging from 0 to 6 inclusively.
                    code: '20814'
                InvalidProductParam:
                  value:
                    message: Invalid 'products' param.
                    code: '20804'
                InvalidCampaignNameParam:
                  value:
                    message: Invalid campaign name param.
                    code: '20807'
                InvalidScheduledAddBudgetAmount:
                  value:
                    message: Invalid 'scheduled_add_budget_amount' parameter. 'scheduled_add_budget_amount' must be a number ranging from 0.01 to 10000 inclusively.
                    code: '20813'
                UnknownError:
                  value:
                    message: Create campaign failed because of unknown error.
                    code: '20800'
                InvalidStartDate:
                  value:
                    message: Invalid campaign start date.
                    code: '20808'
                InvalidEndDate:
                  value:
                    message: Invalid campaign end date.
                    code: '20809'
                BudgetLowerThanMinimum:
                  value:
                    message: Campaign budget is too low.
                    code: '20811'
                CurrencyError:
                  value:
                    message: Invalid currency value. Should be consistent with merchant currency.
                    code: '20822'
                InvalidProductId:
                  value:
                    message: Invalid 'product_id' attribute under 'products'.
                    code: '20803'
              schema:
                $ref: '#/components/schemas/APIError'
          description: failed to create a campaign
      tags:
      - ProductBoost
      summary: Create a ProductBoost campaign
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCampaign'
      security:
      - OAuth2:
        - product_boost:write
      operationId: createCampaign
      x-code-samples:
      - lang: python_requests
        source: "import requests\n\nurl = \"https://merchant.wish.com/api/v3/product_boost/campaigns\"\n\npayload = \"{\\\"auto_renew\\\":true,\\\"campaign_name\\\":\\\"string\\\",\\\"end_at\\\":\\\"2023-04-18T21:58:23Z\\\",\\\"intense_boost\\\":true,\\\"max_budget\\\":{\\\"amount\\\":10.4,\\\"currency_code\\\":\\\"USD\\\"},\\\"merchant_budget\\\":{\\\"amount\\\":10.4,\\\"currency_code\\\":\\\"USD\\\"},\\\"products\\\":[{\\\"keywords\\\":[\\\"string\\\"],\\\"product_id\\\":\\\"string\\\"}],\\\"scheduled_add_budget_amount\\\":{\\\"amount\\\":10.4,\\\"currency_code\\\":\\\"USD\\\"},\\\"scheduled_add_budget_days\\\":[0],\\\"start_at\\\":\\\"2023-04-18T21:58:23Z\\\"}\"\nheaders = {\n    'content-type': \"application/json\",\n    'authorization': \"Bearer REPLACE_BEARER_TOKEN\"\n    }\n\nresponse = requests.request(\"POST\", url, data=payload, headers=headers)\n\nprint(response.text)"
      - lang: javascript_jquery
        source: "var settings = {\n  \"async\": true,\n  \"crossDomain\": true,\n  \"url\": \"https://merchant.wish.com/api/v3/product_boost/campaigns\",\n  \"method\": \"POST\",\n  \"headers\": {\n    \"content-type\": \"application/json\",\n    \"authorization\": \"Bearer REPLACE_BEARER_TOKEN\"\n  },\n  \"processData\": false,\n  \"data\": \"{\\\"auto_renew\\\":true,\\\"campaign_name\\\":\\\"string\\\",\\\"end_at\\\":\\\"2023-04-18T21:58:23Z\\\",\\\"intense_boost\\\":true,\\\"max_budget\\\":{\\\"amount\\\":10.4,\\\"currency_code\\\":\\\"USD\\\"},\\\"merchant_budget\\\":{\\\"amount\\\":10.4,\\\"currency_code\\\":\\\"USD\\\"},\\\"products\\\":[{\\\"keywords\\\":[\\\"string\\\"],\\\"product_id\\\":\\\"string\\\"}],\\\"scheduled_add_budget_amount\\\":{\\\"amount\\\":10.4,\\\"currency_code\\\":\\\"USD\\\"},\\\"scheduled_add_budget_days\\\":[0],\\\"start_at\\\":\\\"2023-04-18T21:58:23Z\\\"}\"\n}\n\n$.ajax(settings).done(function (response) {\n  console.log(response);\n});"
      - lang: php_curl
        source: "<?php\n\n$curl = curl_init();\n\ncurl_setopt_array($curl, array(\n  CURLOPT_URL => \"https://merchant.wish.com/api/v3/product_boost/campaigns\",\n  CURLOPT_RETURNTRANSFER => true,\n  CURLOPT_ENCODING => \"\",\n  CURLOPT_MAXREDIRS => 10,\n  CURLOPT_TIMEOUT => 30,\n  CURLOPT_HTTP_VERSION => CURL_HTTP_VERSION_1_1,\n  CURLOPT_CUSTOMREQUEST => \"POST\",\n  CURLOPT_POSTFIELDS => \"{\\\"auto_renew\\\":true,\\\"campaign_name\\\":\\\"string\\\",\\\"end_at\\\":\\\"2023-04-18T21:58:23Z\\\",\\\"intense_boost\\\":true,\\\"max_budget\\\":{\\\"amount\\\":10.4,\\\"currency_code\\\":\\\"USD\\\"},\\\"merchant_budget\\\":{\\\"amount\\\":10.4,\\\"currency_code\\\":\\\"USD\\\"},\\\"products\\\":[{\\\"keywords\\\":[\\\"string\\\"],\\\"product_id\\\":\\\"string\\\"}],\\\"scheduled_add_budget_amount\\\":{\\\"amount\\\":10.4,\\\"currency_code\\\":\\\"USD\\\"},\\\"scheduled_add_budget_days\\\":[0],\\\"start_at\\\":\\\"2023-04-18T21:58:23Z\\\"}\",\n  CURLOPT_HTTPHEADER => array(\n    \"authorization: Bearer REPLACE_BEARER_TOKEN\",\n    \"content-type: application/json\"\n  ),\n));\n\n$response = curl_exec($curl);\n$err = curl_error($curl);\n\ncurl_close($curl);\n\nif ($err) {\n  echo \"cURL Error #:\" . $err;\n} else {\n  echo $response;\n}"
      - lang: shell_curl
        source: "curl --request POST \\\n  --url 'https://merchant.wish.com/api/v3/product_boost/campaigns' \\\n  --header 'authorization: Bearer REPLACE_BEARER_TOKEN' \\\n  --header 'content-type: application/json' \\\n  --data '{\"auto_renew\":true,\"campaign_name\":\"string\",\"end_at\":\"2023-04-18T21:58:23Z\",\"intense_boost\":true,\"max_budget\":{\"amount\":10.4,\"currency_code\":\"USD\"},\"merchant_budget\":{\"amount\":10.4,\"currency_code\":\"USD\"},\"products\":[{\"keywords\":[\"string\"],\"product_id\":\"string\"}],\"scheduled_add_budget_amount\":{\"amount\":10.4,\"currency_code\":\"USD\"},\"scheduled_add_budget_days\":[0],\"start_at\":\"2023-04-18T21:58:23Z\"}'"
      - lang: java_unirest
        source: "HttpResponse<String> response = Unirest.post(\"https://merchant.wish.com/api/v3/product_boost/campaigns\")\n  .header(\"content-type\", \"application/json\")\n  .header(\"authorization\", \"Bearer REPLACE_BEARER_TOKEN\")\n  .body(\"{\\\"auto_renew\\\":true,\\\"campaign_name\\\":\\\"string\\\",\\\"end_at\\\":\\\"2023-04-18T21:58:23Z\\\",\\\"intense_boost\\\":true,\\\"max_budget\\\":{\\\"amount\\\":10.4,\\\"currency_code\\\":\\\"USD\\\"},\\\"merchant_budget\\\":{\\\"amount\\\":10.4,\\\"currency_code\\\":\\\"USD\\\"},\\\"products\\\":[{\\\"keywords\\\":[\\\"string\\\"],\\\"product_id\\\":\\\"string\\\"}],\\\"scheduled_add_budget_amount\\\":{\\\"amount\\\":10.4,\\\"currency_code\\\":\\\"USD\\\"},\\\"scheduled_add_budget_days\\\":[0],\\\"start_at\\\":\\\"2023-04-18T21:58:23Z\\\"}\")\n  .asString();"
      description: Create a ProductBoost campaign.
    get:
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Campaigns'
          description: successfully queried for ProductBoost campaigns
        '400':
          content:
            application/json:
              examples:
                InvalidStartTimeRange:
                  value:
                    message: Invalid 'start_at_min' and 'start_at_max' parameters. 'start_at_min' must be less than or equal to 'start_at_max'.
                    code: '20405'
                InvalidUpdatedTimeRange:
                  value:
                    message: Invalid 'updated_at_min' and 'updated_at_max' parameters. 'updated_at_min' must be less than or equal to 'updated_at_max'.
                    code: '20404'
                InvalidEndTimeRange:
                  value:
                    message: Invalid 'end_at_min' and 'end_at_max' parameters. 'end_at_min' must be less than or equal to 'end_at_max'.
                    code: '20406'
                InvalidStatesParam:
                  value:
                    message: Invalid 'states' parameter. It can only contain 'NEW', 'SAVED', 'STARTED', 'ENDED', 'PENDING'.
                    code: '20402'
                InvalidProductID:
                  value:
                    message: The product ID either does not exist, or does not belong to the merchant.
                    code: '20401'
                InvalidCampaignDuration:
                  value:
                    message: Invalid 'start_at_min' and 'end_at_max' parameters. 'start_at_min' must be less than 'end_at_max'.
                    code: '20407'
                InvalidCreatedTimeRange:
                  value:
                    message: Invalid 'created_at_min' and 'created_at_max' parameters. 'created_at_min' must be less than or equal to 'created_at_max'.
                    code: '20403'
              schema:
                $ref: '#/components/schemas/APIError'
          description: failed to query for ProductBoost campaigns
      parameters:
      - required: false
        in: query
        description: ID of the product that result campaigns should include.
        name: product_id
        schema:
          type: string
          format: object-id
      - required: false
        in: query
        description: Name of the Campaigns you want to query.
        name: campaign_name
        schema:
          minLength: 1
          type: string
          maxLength: 300
      - required: false
        in: query
        description: A limit on the number of campaigns that will be returned. Used for paging.
        name: limit
        schema:
          default: 50
          minimum: 1
          type: integer
          maximum: 500
      - required: false
        in: query
        description: Restrict campaigns within provided states
        name: states
        schema:
          items:
            $ref: '#/components/schemas/CampaignState'
          type: array
      - required: false
        in: query
        description: Only return campaigns that will or will not auto-renew upon completion.
        name: auto_renew
        schema:
          type: boolean
      - required: false
        in: query
        description: Only return campaigns that are or are not automated campaigns, or duplicated from automated campaigns.
        name: is_automated
        schema:
          type: boolean
      - description: Only return campaigns that are created at or after this time.
        required: false
        name: created_at_min
        in: query
        example: '2020-01-01T07:00:00Z'
        schema:
          type: string
          format: date-time
      - description: Only return campaigns that are created at or before this time.
        required: false
        name: created_at_max
        in: query
        example: '2020-01-01T07:00:00Z'
        schema:
          type: string
          format: date-time
      - in: query
        example: 5e0c27500000000000000000
        description: Only return campaigns with campaign id values greater than or equal to this id. Intended for paging.
        name: campaign_id_min
        schema:
          type: string
          format: object-id
      - in: query
        example: 5e0c27500000000000000000
        description: Only return campaigns with campaign id values less than or equal to this id. Intended for paging.
        name: campaign_id_max
        schema:
          type: string
          format: object-id
      - description: Only return campaigns whose attributes are updated at or after this time.
        required: false
        name: updated_at_min
        in: query
        example: '2020-01-01T07:00:00Z'
        schema:
          type: string
          format: date-time
      - description: Only return campaigns whose attributes are updated at or before this time.
        required: false
        name: updated_at_max
        in: query
        example: '2020-01-01T07:00:00Z'
        schema:
          type: string
          format: date-time
      - description: Only return campaigns that start at or after this time.
        required: false
        name: start_at_min
        in: query
        example: '2020-01-01T07:00:00Z'
        schema:
          type: string
          format: date-time
      - description: Only return campaigns that start at or before this time.
        required: false
        name: start_at_max
        in: query
        example: '2020-01-01T07:00:00Z'
        schema:
          type: string
          format: date-time
      - description: Only return campaigns that end on or after this time.
        required: false
        name: end_at_min
        in: query
        example: '2020-01-01T07:00:00Z'
        schema:
          type: string
          format: date-time
      - description: Only return campaigns that end on or before this time.
        required: false
        name: end_at_max
        in: query
        example: '2020-01-01T07:00:00Z'
        schema:
          type: string
          format: date-time
      - required: false
        in: query
