            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
          description: failed to reactivate the subscription
      parameters:
      - $ref: '#/components/parameters/subscription_id'
      - $ref: '#/components/parameters/endpoint'
      - $ref: '#/components/parameters/status'
      tags:
      - Webhook
      summary: Update a Subscription
      security:
      - OAuth2:
        - webhook:write
      operationId: updateSubscription
      x-code-samples:
      - lang: java_unirest
        source: "HttpResponse<String> response = Unirest.put(\"https://merchant.wish.com/api/v3/webhook/subscriptions/{id}?endpoint=SOME_STRING_VALUE&status=SOME_STRING_VALUE\")\n  .header(\"authorization\", \"Bearer REPLACE_BEARER_TOKEN\")\n  .asString();"
