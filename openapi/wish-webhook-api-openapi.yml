components:
  parameters:
    subscription_id:
      schema:
        type: string
        format: object-id
      required: true
      description: ID of the subscription
      name: id
      in: path
    status:
      schema:
        enum:
        - ACTIVE
        type: string
      required: false
      description: Whether the subscription is active
      name: status
      in: query
    topic_id:
      schema:
        type: string
        format: object-id
      required: false
      description: ID of the topic, obtained from the [getTopics API](/documentation/api/v3/reference#operation/getTopics)
      name: topic_id
      in: query
    endpoint:
      schema:
        type: string
      required: false
      description: Endpoint URL that Wish should send POST request to when the subscribed event happens
      name: endpoint
      in: query
  schemas:
    APIError:
      required:
      - code
      - message
      type: object
      properties:
        message:
          type: string
        code:
          type: integer
          format: int32
    GetAllTopicsResponse:
      items:
        $ref: '#/components/schemas/Topic'
      type: array
      description: List of available topics that you can subscribe.
    Topic:
      type: object
      properties:
